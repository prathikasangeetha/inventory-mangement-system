<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <div>
        <h1>Inventory Management System</h1>
        <p>Simple CRUD-based inventory dashboard</p>
    </div>
</header>

<main class="container">
    <section class="stats-grid">
        <div class="stat-card"><span>Total Products</span><strong id="totalProducts">0</strong></div>
        <div class="stat-card"><span>Total Quantity</span><strong id="totalQuantity">0</strong></div>
        <div class="stat-card"><span>Categories</span><strong id="totalCategories">0</strong></div>
        <div class="stat-card"><span>Inventory Value</span><strong id="totalValue">₹0.00</strong></div>
    </section>

    <section class="panel">
        <div class="panel-title">
            <h2 id="formTitle">Add New Product</h2>
            <button id="cancelEditBtn" class="secondary hidden" type="button">Cancel Edit</button>
        </div>

        <div id="message" class="message hidden"></div>

        <form id="itemForm">
            <input type="hidden" id="itemId">
            <div class="form-grid">
                <div class="field">
                    <label for="productName">Product Name *</label>
                    <input id="productName" type="text" maxlength="100" required>
                </div>
                <div class="field">
                    <label for="category">Category *</label>
                    <input id="category" type="text" maxlength="100" required>
                </div>
                <div class="field">
                    <label for="quantity">Quantity *</label>
                    <input id="quantity" type="number" min="0" required>
                </div>
                <div class="field">
                    <label for="price">Price (₹) *</label>
                    <input id="price" type="number" min="0.01" step="0.01" required>
                </div>
                <div class="field">
                    <label for="supplier">Supplier *</label>
                    <input id="supplier" type="text" maxlength="100" required>
                </div>
                <div class="field">
                    <label for="date">Date *</label>
                    <input id="date" type="date" required>
                </div>
            </div>
            <button id="submitBtn" class="primary" type="submit">Add Product</button>
        </form>
    </section>

    <section class="panel">
        <div class="panel-title">
            <h2>Product List</h2>
            <div class="filters">
                <input id="searchInput" type="search" placeholder="Search product, category or supplier">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Product</th><th>Category</th><th>Quantity</th>
                        <th>Price</th><th>Supplier</th><th>Date</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody">
                    <tr><td colspan="8" class="empty">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
